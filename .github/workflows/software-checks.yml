name: Software checks
on:
  push:
    branches: [main]
    paths: ['firmware/**', 'etudes/**', '.github/workflows/software-checks.yml']
  pull_request:
    paths: ['firmware/**', 'etudes/**', '.github/workflows/software-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Execute host tests and compile Cortex-M4F core
        shell: pwsh
        run: |
          $compilerPath = (Get-Command clang.exe -ErrorAction Stop).Source
          python firmware/tests/run_tests.py --clang $compilerPath --out build/smartsense
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: software-test-report
          path: build/smartsense/RESULTATS_LOGICIEL.json
          if-no-files-found: warn
          retention-days: 7
